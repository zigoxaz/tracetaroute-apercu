  const WAIT = 10000;
  const bin = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };
  const open = async (raw) => {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const page = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(D.i) }, key, bin(D.d)));
    // remplace la page de garde par l'app (sans document.write, ignoré si la page se charge encore)
    const doc = new DOMParser().parseFromString(page, 'text/html');
    const take = (from, to) => to.replaceChildren(...[...from.childNodes].map((n) => document.importNode(n, true)));
    take(doc.head, document.head);
    take(doc.body, document.body);
    for (const a of doc.documentElement.attributes) document.documentElement.setAttribute(a.name, a.value);
    // des scripts importés ne s'exécutent pas : on les recrée
    for (const old of document.querySelectorAll('script')) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  };
  const derive = async (code) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bin(D.s), iterations: D.n }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    return new Uint8Array(await crypto.subtle.exportKey('raw', key));
  };
  // attente de 10 s entre deux essais, même après un rechargement
  let timer = 0;
  const wait = () => {
    const left = Number(store.get('attente') || 0) - Date.now();
    clearTimeout(timer);
    if (left > 0) {
      $('b').disabled = true;
      $('m').textContent = 'Code incorrect. Nouvel essai dans ' + Math.ceil(left / 1000) + ' s.';
      timer = setTimeout(wait, Math.min(1000, left));
    } else {
      $('b').disabled = false;
      if ($('m').textContent.startsWith('Code incorrect')) $('m').textContent = '';
    }
  };
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('b').disabled) return;
    $('b').disabled = true;
    $('m').textContent = 'Vérification…';
    try {
      const raw = await derive($('c').value.trim());
      await open(raw);
      store.set('acces', btoa(String.fromCharCode(...raw)));
    } catch {
      store.set('attente', String(Date.now() + WAIT));
      $('c').value = '';
      wait();
    }
  });
  // appareil déjà autorisé : on entre directement
  const known = store.get('acces');
  if (known) open(bin(known)).catch(() => { store.del('acces'); wait(); });
  else wait();
})();
