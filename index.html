  };
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('b').disabled) return;
    $('b').disabled = true;
    $('m').textContent = 'Vérification…';
    try {
      const raw = await derive($('c').value.trim());
      await open(raw);
      store.set('acces', btoa(String.fromCharCode(...raw)));
    } catch {
      store.set('attente', String(Date.now() + WAIT));
      $('c').value = '';
      wait();
    }
  });
  // appareil déjà autorisé : on entre directement
  const known = store.get('acces');
  if (known) open(bin(known)).catch(() => { store.del('acces'); wait(); });
  else wait();
})();
</script>
</body>
</html>
